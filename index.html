<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instant Quote</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f5f4;color:#17282c}
button,input{font:inherit}button{cursor:pointer}
#bar{background:#17282c;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:14px}
#bar button{border:0;border-radius:6px;padding:9px 12px;font-weight:600}
.y{background:#ffd60a;color:#17282c}.w{background:#fff;color:#17282c}
main{max-width:560px;margin:18px auto;padding:0 14px}
#app{background:#fff;border-radius:12px;padding:22px;border:1px solid #dde3e1}
.pill{display:inline-block;background:#dff3ef;color:#0b5f56;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
h1{font-size:24px;margin:10px 0 2px;line-height:1.2}
h2{font-size:17px;margin:20px 0 8px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #d3dcd9;border-radius:8px;padding:12px 14px;margin:6px 0;color:inherit}
.opt:hover{border-color:#0f766e}.opt.on{border-color:#0f766e;background:#e9f7f4}
.est{font-size:34px;font-weight:800;color:#0b5f56;margin:4px 0}
small{color:#566a6f}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:#fff;box-shadow:-6px 0 24px #0005;padding:16px;overflow:auto;display:none;z-index:9}
#dr input{width:100%;padding:8px;border:1px solid #c3cfcc;border-radius:6px}
#dr .row{display:flex;gap:6px;margin:6px 0;align-items:center}
#dr .row input.n{width:84px;flex:none}
#dr .row button{flex:none;border:1px solid #c3cfcc;background:#fff;border-radius:6px;padding:8px 10px}
#dr .top{display:flex;justify-content:space-between;align-items:center}
#dr .top button{border:1px solid #c3cfcc;background:#fff;border-radius:6px;padding:6px 12px}
button:focus-visible,input:focus-visible{outline:3px solid #ffd60a;outline-offset:1px}
</style>
</head>
<body>
<div id="bar">
  <span>Demo built for <b id="bn"></b></span>
  <span>
    <button class="w" onclick="openDr()">Edit Services &amp; Prices</button>
    <button class="y" onclick="buy()">Add This to Our Website -&gt;</button>
  </span>
</div>
<main><div id="app"></div></main>
<div id="dr"></div>

<script>
/* ===== Stripe Payment Link ===== */
const STRIPE = 'https://buy.stripe.com/eVq6oIe9f6UcgZu46pbAs01';

/* ===== TRADES. Keep the service ORDER stable: the Stripe config stores default services by position ===== */
const SZ3 = [['1 Room',1],['2-3 Rooms',2.3],['Full House',5]];
const T = {
 builder:{l:'Builders',q:'How big is the project?',o:[['Small Job',1],['Medium Project',1.4],['Large Project',2]],
  s:[['House Extension',25000,55000],['Loft Conversion',30000,55000],['Garage Conversion',12000,25000],['Brickwork & Repairs',800,3500],['Structural Alterations',3000,9000],['Full Renovation',20000,60000]]},
 driveways:{l:'Driveways & Building',q:'How much space do you need covered?',o:[['1 Car',1],['2 Cars',1.6],['3+ Cars or Large Area',2.3]],
  s:[['Resin Driveways',3500,7000],['Block Paving',3000,7500],['Tarmac Driveway',2500,5500],['Patio & Landscaping',2500,7000],['Dropped Kerb',1500,3000],['Walls & Fencing',1200,4000]]},
 plumber:{l:'Plumbers',q:'How big is the property?',o:[['1 Bathroom (5-7 Rads)',1],['2 Bathrooms (8-10 Rads)',1.6],['3+ Bathrooms',2.3]],
  s:[['Boiler Installation',2200,4200],['Bathroom Fitting',3500,8000],['Leak & Pipe Repairs',120,450],['Power Flush',350,700],['Hot Water Cylinder',1800,3500],['Radiator Replacement',150,450]]},
 heatingengineer:{l:'Heating Engineers',q:'How big is the property?',o:[['1 Bathroom (5-7 Rads)',1],['2 Bathrooms (8-10 Rads)',1.6],['3+ Bathrooms',2.3]],
  s:[['Boiler Installation',2200,4200],['Boiler Servicing',70,130],['Central Heating',3500,7500],['Underfloor Heating',2500,7000],['Power Flush',350,700],['Smart Heating Controls',250,650]]},
 electrician:{l:'Electricians',q:'What type of property is it?',o:[['1-2 Bed Flat',1],['3 Bed Semi',1.4],['4+ Bed Detached',2],['Commercial',3]],
  s:[['Full Rewire',3500,8000],['Consumer Unit Upgrade',450,900],['EV Charger Installation',800,1400],['EICR Testing',150,350],['Lighting & Sockets',150,900],['Outdoor Lighting',300,1200]]},
 roofer:{l:'Roofers',q:'What size is the roof?',o:[['Garage or Small Extension',1],['Semi-Detached',1.6],['Detached or Large',2.2]],
  s:[['New Roof',6000,15000],['Flat Roofing',1800,5000],['Roof Repairs',250,900],['Fascias & Soffits',1000,3000],['Guttering',400,1500],['Chimney Repairs',350,1200]]},
 carpenter:{l:'Carpenters',q:'How much work is it?',o:SZ3,
  s:[['Fitted Wardrobes',1200,3500],['Kitchen Fitting',2500,7000],['Doors & Skirting',400,1800],['Staircase Renovation',1500,4500],['Decking & Pergolas',1500,5000],['Bespoke Shelving',350,1400]]},
 plasterer:{l:'Plasterers',q:'How much needs plastering?',o:SZ3,
  s:[['Skimming',300,600],['Full Re-plaster',500,1000],['Plasterboarding',350,800],['External Rendering',3000,7500],['Coving & Cornice',150,450],['Artex Removal',350,800]]},
 painter:{l:'Painters & Decorators',q:'How much needs painting?',o:[['1 Room',1],['2-3 Rooms',2.2],['Whole House',4.5]],
  s:[['Interior Painting',300,700],['Exterior Painting',1500,4000],['Wallpapering',250,600],['Woodwork & Doors',200,600],['Kitchen Respray',800,2200],['Fence & Shed Painting',150,500]]},
 tiler:{l:'Tilers',q:'How much needs tiling?',o:[['1 Room',1],['2-3 Rooms',2.3],['Full House',4.5]],
  s:[['Bathroom Tiling',600,1500],['Kitchen Splashback',200,500],['Floor Tiling',500,1500],['Wet Room Tanking',1200,2800],['Patio Tiling',800,2500],['Feature Wall Tiling',300,800]]},
 hvac:{l:'Heating & Air Conditioning',q:'What needs covering?',o:[['Single Room',1],['2-3 Rooms',1.8],['Full Property',3],['Commercial',4.5]],
  s:[['Air Conditioning',1500,3500],['Heat Pumps',8000,14000],['Ventilation & Extraction',400,1500],['MVHR Systems',3500,7000],['AC Servicing',100,250],['Commercial Maintenance',250,800]]},
 glaziery:{l:'Glaziers',q:'How much glazing do you need?',o:[['1-2 Windows or Door',1],['3-5 Windows',2.2],['Full House Glazing',5]],
  s:[['uPVC Windows',500,1400],['Bi-Fold Doors',2500,6500],['Composite Doors',1000,2400],['Misted Unit Repairs',120,400],['Roof Windows',700,1800],['Sash Window Restoration',600,1800]]}
};
/* partial keyword matching, checked in this order */
const KW = [['drive','driveways'],['elec','electrician'],['plumb','plumber'],['heat','heatingengineer'],['roof','roofer'],['plast','plasterer'],['paint','painter'],['tile','tiler'],['carp','carpenter'],['glaz','glaziery'],['window','glaziery'],['hvac','hvac'],['air','hvac'],['build','builder']];
function pick(n){n=(n||'').toLowerCase().replace(/[^a-z]/g,'');if(T[n])return n;for(const [k,v] of KW)if(n.includes(k))return v;return 'builder';}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q = new URLSearchParams(location.search);
const key = pick(q.get('niche'));
const city = (q.get('city')||'').trim();
const cityOk = !!city && city.toLowerCase()!=='your area';
function avg(k){const a=T[k].s;return [Math.round(a.reduce((t,x)=>t+x[1],0)/a.length/10)*10,Math.round(a.reduce((t,x)=>t+x[2],0)/a.length/10)*10];}
function bracket(name){const n=name.toLowerCase();for(const k of [key,...Object.keys(T)]){const m=T[k].s.find(x=>x[0].toLowerCase()===n);if(m)return[m[1],m[2]];}return avg(key);}

const scraped = (q.get('services')||'').split(',').map(x=>x.trim()).filter(Boolean).slice(0,8);
const S = {
  co: q.get('company')||q.get('name')||q.get('companyName')||'',
  mult: Math.min(2,Math.max(0.5,+q.get('mult')||1)), sel: -1, sz: -1,
  svc: scraped.length ? scraped.map(n=>{const b=bracket(n);return {n,l:b[0],h:b[1]};}) : T[key].s.map(x=>({n:x[0],l:x[1],h:x[2]}))
};

const rnd = n => n<1000 ? Math.round(n/10)*10 : Math.round(n/50)*50;
const gbp = n => '£'+rnd(n).toLocaleString('en-GB');

function calc(){
  const t=T[key];
  let h=`<span class="pill">${cityOk?esc(city):'UK Local Estimate'}</span><h1>${esc(S.co||'Get Your Instant Quote')}</h1><small>${t.l}: free guide price in 30 seconds</small>`;
  h+=`<h2>1. What do you need help with?</h2>`;
  if(!S.svc.length)h+='<small>Add a service using Edit Services &amp; Prices.</small>';
  S.svc.forEach((s,i)=>{h+=`<button class="opt${i===S.sel?' on':''}" onclick="ps(${i})">${esc(s.n)}</button>`;});
  if(S.sel>=0){h+=`<h2>2. ${esc(t.q)}</h2>`;t.o.forEach((o,i)=>{h+=`<button class="opt${i===S.sz?' on':''}" onclick="pz(${i})">${esc(o[0])}</button>`;});}
  if(S.sel>=0&&S.sz>=0){
    const s=S.svc[S.sel],m=t.o[S.sz][1]*S.mult;
    h+=`<h2>Your estimate</h2><div class="est">${gbp(s.l*m)} to ${gbp(s.h*m)}</div><small>A guide price including labour and materials. The final quote is confirmed after a quick survey.</small><br><br><button class="opt on" onclick="S.sel=-1;S.sz=-1;calc()">Start again</button>`;
  }
  $('app').innerHTML=h;
  $('bn').textContent=S.co||'your business';
}
function ps(i){S.sel=i;S.sz=-1;calc();}
function pz(i){S.sz=i;calc();}

/* ===== Edit Services & Prices drawer ===== */
function openDr(){dr();$('dr').style.display='block';}
function dr(){
  let h=`<div class="top"><b>Edit Services &amp; Prices</b><button onclick="$('dr').style.display='none'">Close</button></div>
  <h2>Company name</h2><input value="${esc(S.co)}" oninput="S.co=this.value;calc()">
  <h2>Price multiplier: <span id="mv">${S.mult}</span>x</h2>
  <input type="range" min="0.5" max="2" step="0.05" value="${S.mult}" oninput="S.mult=+this.value;$('mv').textContent=S.mult;calc()">
  <h2>Services (£ low and high)</h2>`;
  S.svc.forEach((s,i)=>{h+=`<div class="row"><input value="${esc(s.n)}" oninput="S.svc[${i}].n=this.value;calc()"><input class="n" type="number" value="${s.l}" oninput="S.svc[${i}].l=+this.value;calc()"><input class="n" type="number" value="${s.h}" oninput="S.svc[${i}].h=+this.value;calc()"><button onclick="del(${i})" aria-label="Remove">✕</button></div>`;});
  h+=`<div class="row"><input id="nw" placeholder="Add a service"><button onclick="add()">Add</button></div>`;
  $('dr').innerHTML=h;
}
function add(){const v=$('nw').value.trim();if(!v)return;const b=bracket(v);S.svc.push({n:v,l:b[0],h:b[1]});dr();calc();}
function del(i){S.svc.splice(i,1);S.sel=-1;S.sz=-1;dr();calc();}

/* ===== Stripe: send the contractor's setup in client_reference_id =====
   Stripe only allows letters, numbers, - and _ (max 200 chars), so the setup is packed as:
   base64url of JSON  [company, city, niche, multiplier, ...services]
   where a service that is one of the niche's defaults is sent as its position number (0-5), custom ones as text. */
const b64 = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function buy(){
  if(STRIPE.indexOf('PASTE')===0){alert('Add your Stripe Payment Link at the top of index.html first.');return;}
  const d=T[key].s.map(x=>x[0]);
  const items=S.svc.map(s=>{const i=d.indexOf(s.n);return i>=0?i:s.n;});
  let a=[S.co,cityOk?city:'',key,Math.round(S.mult*100)/100].concat(items),id=b64(a);
  while(id.length>200&&a.length>4){a.pop();id=b64(a);}
  if(id.length>200){a[0]=String(a[0]).slice(0,25);a[1]=String(a[1]).slice(0,15);id=b64(a);}
  location.href=STRIPE+(STRIPE.indexOf('?')>-1?'&':'?')+'client_reference_id='+id;
}

/* hide the demo bar inside the live embed: add &demo=0 to the embed link */
if(q.get('demo')==='0'||q.get('embed')==='1')$('bar').style.display='none';
calc();
</script>
</body>
</html>
