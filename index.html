<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Instant Quote Calculator</title>
<style>
:root{--accent:#f5b83d;--bg:#0b1220;--panel:#172033;--panel2:#0f1827;--line:#28344a;--text:#eef2f7;--muted:#9aa7bb;--ink:#0b1220}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}

.demobar{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;background:linear-gradient(90deg,#1b2740,#14203a);border-bottom:1px solid var(--line)}
.demotext{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;letter-spacing:.02em;min-width:0}
.demotext span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.18);flex:none}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-size:24px;font-weight:800;color:var(--accent);line-height:1.1;min-width:0;overflow-wrap:anywhere}
.pill{flex:none;max-width:55%;font-size:14px;color:#cbd5e1;background:#26324a;border-radius:999px;padding:8px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wrap{max-width:640px;margin:0 auto;padding:24px 16px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px 20px}
.emoji{font-size:34px;line-height:1;margin-bottom:10px;text-align:center}
h1{margin:0 0 8px;font-size:28px;line-height:1.15;text-align:center;letter-spacing:-.01em}
.sub{margin:0 0 22px;text-align:center;color:var(--muted);line-height:1.5;font-size:16px}
.lab{display:block;margin:18px 0 8px;font-weight:700;font-size:15px}
select{width:100%;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-size:17px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9aa7bb 50%),linear-gradient(135deg,#9aa7bb 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{padding:12px 8px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:14px;line-height:1.25;min-height:56px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}

.result{margin-top:22px;padding:22px 16px;border-radius:18px;border:1px solid var(--line);background:var(--panel2);text-align:center}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.price{font-size:40px;line-height:1.1;margin:10px 0 6px;font-weight:800;color:var(--accent);letter-spacing:-.02em}
.for{font-size:14px;color:var(--muted);margin-bottom:14px}
.rows{border-top:1px dashed var(--line);padding-top:12px;text-align:left;font-size:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:#cbd5e1}
.row b{color:var(--text);font-weight:600;text-align:right}
.incl{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1px dashed var(--line);text-align:left;font-size:14px;color:var(--muted)}
.incl li{padding:3px 0 3px 22px;position:relative}
.incl li:before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:800}

.btn{display:block;width:100%;margin-top:20px;padding:18px 16px;border:0;border-radius:16px;background:var(--accent);color:var(--ink);font-weight:800;font-size:18px;cursor:pointer;text-align:center;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-sm{width:auto;margin:0;padding:9px 14px;font-size:13px;border-radius:12px;flex:none}
.fine{margin:12px 0 0;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}

.pitch{margin-top:26px;padding:24px 20px;border-radius:22px;border:1px dashed var(--accent);background:rgba(255,255,255,.02);text-align:center}
.pitch h2{margin:0 0 8px;font-size:21px}
.pitch p{margin:0;color:var(--muted);line-height:1.55;font-size:15px}

.form label{display:block;margin:12px 0 6px;font-size:14px;font-weight:600}
.form input,.form textarea{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:16px}
.form textarea{min-height:80px;resize:vertical}
.msg{margin-top:12px;text-align:center;font-size:14px}

.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,7,15,.72);padding:0}
.sheet{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:26px 20px calc(26px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;position:relative}
@media(min-width:640px){.modal{align-items:center;padding:20px}.sheet{border-radius:24px}}
.x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:20px;line-height:1}
.sheet h3{margin:0 40px 8px 0;font-size:23px;line-height:1.2}
.sheet p{color:var(--muted);line-height:1.55;margin:0 0 14px}
.sheet ul{list-style:none;padding:0;margin:0 0 16px}
.sheet li{padding:7px 0 7px 26px;position:relative;line-height:1.4}
.sheet li:before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:800}
.bigprice{font-size:34px;font-weight:800;color:var(--accent)}
.bigprice small{font-size:15px;color:var(--muted);font-weight:600}
.secure{margin:10px 0 0;text-align:center;font-size:12px;color:var(--muted)}
@media(max-width:420px){h1{font-size:25px}.price{font-size:36px}.brand{font-size:21px}}
</style>
</head>
<body>

<div class="demobar" id="demoBar" hidden>
  <div class="demotext"><span class="dot"></span><span class="t" id="demoLabel"></span></div>
  <button class="btn btn-sm" id="demoAdd" type="button">Add to my website →</button>
</div>

<header class="top">
  <div class="brand" id="brand">Your Company</div>
  <div class="pill" id="pill"></div>
</header>

<main class="wrap">
  <section class="card" id="calc">
    <div class="emoji" id="emoji" aria-hidden="true"></div>
    <h1 id="headline">Get Your Instant Estimate</h1>
    <p class="sub" id="sub"></p>

    <label class="lab" for="service">What do you need?</label>
    <select id="service"></select>

    <div class="lab" id="sizeTitle">Size</div>
    <div class="seg" id="sizeSeg"></div>

    <div class="lab">When do you need it?</div>
    <div class="seg" id="urgSeg"></div>

    <div class="result" aria-live="polite">
      <div class="kicker">Estimated guide price</div>
      <div class="price" id="price"></div>
      <div class="for" id="priceFor"></div>
      <div class="rows" id="rows"></div>
      <ul class="incl" id="incl"></ul>
    </div>

    <button class="btn" id="cta" type="button">Request this quote →</button>
    <p class="fine" id="fine"></p>
  </section>

  <section class="card form" id="leadCard" hidden style="margin-top:18px">
    <h2 style="margin:0 0 4px;font-size:21px">Send your details</h2>
    <p class="sub" style="margin:0 0 6px;text-align:left" id="leadSub"></p>
    <form id="leadForm" novalidate>
      <label for="lName">Your name</label><input id="lName" autocomplete="name" required>
      <label for="lPhone">Phone</label><input id="lPhone" type="tel" autocomplete="tel" required>
      <label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="email">
      <label for="lPost" id="lPostLab">Postcode</label><input id="lPost" autocomplete="postal-code">
      <label for="lNotes">Anything else we should know?</label><textarea id="lNotes"></textarea>
      <button class="btn" type="submit" id="lSubmit">Send my request</button>
      <div class="msg" id="lMsg"></div>
    </form>
  </section>

  <section class="pitch" id="pitch" hidden>
    <h2 id="pitchH"></h2>
    <p id="pitchP"></p>
    <button class="btn" id="pitchBtn" type="button">Add this to my website →</button>
  </section>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <button class="x" id="mClose" type="button" aria-label="Close">×</button>
    <h3 id="mTitle"></h3>
    <p id="mLead"></p>
    <ul id="mList"></ul>
    <div class="bigprice" id="mPrice"></div>
    <a class="btn" id="mBuy" href="#" rel="noopener">Claim &amp; Activate Online Now →</a>
    <div class="secure">🔒 Secure checkout powered by Stripe</div>
  </div>
</div>

<noscript><p style="padding:24px;text-align:center">Please enable JavaScript to use the quote calculator.</p></noscript>

    for (var i = 0; i < N.services.length; i++) { if (N.services[i][0].toLowerCase() === n) { return N.services[i]; } }
    return null;
  }
  var matched = [];
  (q.get('services') || '').split(',').forEach(function (s) {
    var f = findService(clean(s, 60));
    if (f && matched.indexOf(f) === -1) { matched.push(f); }
  });
  var fromSite = matched.length >= 3;
  var shown;
  if (fromSite) { shown = matched.slice(0, 6); }
  else if (nicheKey === 'combo') { shown = ['Resin Driveways', 'Block Paving', 'Patio & Landscaping', 'House Extension', 'Loft Conversion', 'Brickwork & Repairs'].map(findService); }
  else { shown = N.services.slice(0, 6); }

  var override = parseFloat(q.get('mult'));
  var cityMult = (override >= 0.5 && override <= 2) ? override : ((isUS ? US_CITY : UK_CITY)[cityKey] || 1);

  /* ---------- State + maths ---------- */
  var cur = isUS ? '$' : '£';
  var rate = isUS ? USD_RATE : 1;
  var st = { svc: 0, size: 1, urg: 0 };

  function money(n) { return cur + Math.round(n).toLocaleString(isUS ? 'en-US' : 'en-GB'); }
  function nice(n) { var step = n < 1000 ? 10 : (n < 10000 ? 50 : 100); return Math.round(n / step) * step; }
  function pct(m) { var p = Math.round((m - 1) * 100); return p === 0 ? 'Standard rate' : (p > 0 ? '+' + p + '%' : '−' + Math.abs(p) + '%'); }

  function compute() {
    var base = shown[st.svc][1] * rate * SIZE_MULT[st.size];
    var local = base * cityMult;
    var u = URGENCY[st.urg];
    var callout = u.callout ? N.callout * rate : 0;
    var total = local * u.mult + callout;
    return { base: base, total: total, low: nice(total * 0.9), high: nice(total * 1.2), callout: callout, u: u };
  }

  function row(label, value) {
    var d = document.createElement('div'); d.className = 'row';
    var a = document.createElement('span'); a.textContent = label;
    var b = document.createElement('b'); b.textContent = value;
    d.appendChild(a); d.appendChild(b); return d;
  }

  function render() {
    var r = compute();
    var svc = shown[st.svc][0];
    $('price').textContent = money(r.low) + ' – ' + money(r.high);
    $('priceFor').textContent = svc + ' in ' + city;
    var rows = $('rows'); rows.textContent = '';
    rows.appendChild(row(svc + ' · ' + N.sizes[st.size], money(nice(r.base))));
    rows.appendChild(row(city + ' local rates', pct(cityMult)));
    var urgTxt = r.u.mult === 1 ? 'Included' : '+' + Math.round((r.u.mult - 1) * 100) + '%' + (r.callout ? ' + ' + money(r.callout) + ' call-out' : '');
    rows.appendChild(row('Timing: ' + r.u.label, urgTxt));
    var segs = $('sizeSeg').children; for (var i = 0; i < segs.length; i++) { segs[i].setAttribute('aria-pressed', i === st.size ? 'true' : 'false'); }
    var us = $('urgSeg').children; for (var j = 0; j < us.length; j++) { us[j].setAttribute('aria-pressed', j === st.urg ? 'true' : 'false'); }
  }

  /* ---------- Stripe link carrying the contractor's details to n8n ---------- */
  function b64url(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function stripeNiche() {
    if (nicheKey !== 'combo') { return nicheKey; }
    var dn = 0, bn = 0;
    shown.forEach(function (s) {
      if (NICHES.driveways.services.some(function (x) { return x[0] === s[0]; })) { dn++; } else { bn++; }
    });
    return (fromSite && bn > dn) ? 'builder' : 'driveways';
  }
  function stripeUrl() {
    var key = stripeNiche();
    var list = NICHES[key].services.map(function (s) { return s[0]; });
    var idx = [];
    if (fromSite) { shown.forEach(function (s) { var i = list.indexOf(s[0]); if (i >= 0) { idx.push(i); } }); }
    var arr = [clean(name, 40), clean(city, 30), key, Math.round(cityMult * 100) / 100].concat(idx);
    var ref = b64url(JSON.stringify(arr));
    if (ref.length > 190) { arr[0] = clean(name, 18); ref = b64url(JSON.stringify(arr)); }
    return STRIPE_LINK + '?client_reference_id=' + ref;
  }

  /* ---------- Build the page ---------- */
  function build() {
    document.title = name + ' – Instant Quote Calculator';
    document.documentElement.style.setProperty('--accent', N.accent);
    $('brand').textContent = name;
    $('pill').textContent = city + ' · ' + N.label;
    $('emoji').textContent = N.emoji;
    $('headline').textContent = N.headline;
    $('sub').textContent = N.sub;
    $('sizeTitle').textContent = N.sizeTitle;

    var sel = $('service');
    shown.forEach(function (s, i) { var o = document.createElement('option'); o.value = i; o.textContent = s[0]; sel.appendChild(o); });
    sel.addEventListener('change', function () { st.svc = parseInt(sel.value, 10); render(); });

    N.sizes.forEach(function (label, i) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = label;
      b.addEventListener('click', function () { st.size = i; render(); }); $('sizeSeg').appendChild(b);
    });
    URGENCY.forEach(function (u, i) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = u.label;
      b.addEventListener('click', function () { st.urg = i; render(); }); $('urgSeg').appendChild(b);
    });
    var incl = $('incl'); N.includes.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; incl.appendChild(li); });

    if (embed) {
      $('fine').textContent = 'Guide price only. ' + name + ' will confirm an exact quote once they have seen the job.';
      if (LEAD_WEBHOOK) {
        $('cta').addEventListener('click', function () { $('leadCard').hidden = false; $('leadCard').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
        $('leadSub').textContent = 'Tell ' + name + ' where to reach you and they will confirm your quote.';
        $('lPostLab').textContent = isUS ? 'ZIP code' : 'Postcode';
      } else { $('cta').hidden = true; }
    } else {
      $('demoBar').hidden = false;
      $('demoLabel').textContent = 'LIVE DEMO · your preview';
      $('fine').textContent = 'This is the exact calculator your customers would see. Prices are indicative until calibrated to your real rates.';
      $('pitch').hidden = false;
      $('pitchH').textContent = 'Want this on ' + name + "'s website?";
      $('pitchP').textContent = 'Calibrated to your services' + (fromSite ? ' (' + shown.slice(0, 3).map(function (s) { return s[0]; }).join(', ') + (shown.length > 3 ? ' and more' : '') + ')' : '') + ' and priced for ' + city + '. One line of code, or we install it for you.';
      ['cta', 'demoAdd', 'pitchBtn'].forEach(function (id) { $(id).addEventListener('click', openModal); });
    }
    render();
  }

  function openModal() {
    $('mTitle').textContent = 'Put this calculator on ' + name + "'s website";
    $('mLead').textContent = 'This is exactly what your customers would see, with an instant price for the jobs you actually do.';
    var list = $('mList'); list.textContent = '';
    var bullets = [
      fromSite ? 'Matched to your services: ' + shown.slice(0, 3).map(function (s) { return s[0]; }).join(', ') + (shown.length > 3 ? ' + ' + (shown.length - 3) + ' more' : '') : 'Built for ' + N.label + ' businesses',
      'Priced for ' + city + ' and calibrated to your rates',
      'One line of code for your site, or free done-for-you installation'
    ];
    bullets.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; list.appendChild(li); });
    $('mPrice').textContent = '';
    $('mPrice').appendChild(document.createTextNode(SETUP_PRICE_TEXT + ' '));
    if (isUS) { var sm = document.createElement('small'); sm.textContent = SETUP_PRICE_USD; $('mPrice').appendChild(sm); }
    $('mBuy').href = stripeUrl();
    $('modal').hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeModal() { $('modal').hidden = true; document.body.style.overflow = ''; }
  $('mClose').addEventListener('click', closeModal);
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) { closeModal(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeModal(); } });

  /* ---------- Homeowner request form (embed mode, needs LEAD_WEBHOOK) ---------- */
  $('leadForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var msg = $('lMsg');
    if (!$('lName').value.trim() || !$('lPhone').value.trim()) { msg.textContent = 'Please add your name and phone number.'; return; }
    var r = compute();
    var payload = {
      contractor: { name: name, city: city, niche: stripeNiche() },
      lead: { name: $('lName').value.trim(), phone: $('lPhone').value.trim(), email: $('lEmail').value.trim(), postcode: $('lPost').value.trim(), notes: $('lNotes').value.trim() },
      estimate: { service: shown[st.svc][0], size: N.sizes[st.size], timing: r.u.label, low: r.low, high: r.high, currency: cur }
    };
    $('lSubmit').disabled = true; msg.textContent = 'Sending…';
    fetch(LEAD_WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (res) { if (!res.ok) { throw new Error('bad'); } msg.textContent = 'Thanks! ' + name + ' will be in touch shortly.'; $('leadForm').reset(); })
      .catch(function () { msg.textContent = 'Sorry, that did not send. Please try again.'; })
      .then(function () { $('lSubmit').disabled = false; });
  });

  build();
})();
</script>
</body>
</html>
